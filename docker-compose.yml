name: xling

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-internal}
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xling}
      MYSQL_USER: ${MYSQL_USER:-xling}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xling}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:-docker.1ms.run/ollama/ollama:0.1.48}
    profiles: [models]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-init:
    image: ${OLLAMA_IMAGE:-docker.1ms.run/ollama/ollama:0.1.48}
    profiles: [models]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_PROVIDER: ${AI_PROVIDER:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_CLASSIFIER_MODEL: ${OLLAMA_CLASSIFIER_MODEL:-}
      OLLAMA_CLASSIFIER_MODEL_DIR: ${OLLAMA_CLASSIFIER_MODEL_DIR:-}
      OLLAMA_CLASSIFIER_MODEL_FILE: ${OLLAMA_CLASSIFIER_MODEL_FILE:-}
      OLLAMA_ANSWER_MODEL_DIR: ${OLLAMA_ANSWER_MODEL_DIR:-}
      OLLAMA_ANSWER_MODEL_FILE: ${OLLAMA_ANSWER_MODEL_FILE:-}
    entrypoint: ["/bin/sh", "/usr/local/bin/init-models"]
    volumes:
      - ./models:/models:ro
      - ./scripts/docker-ollama-init.sh:/usr/local/bin/init-models:ro
      - ollama-data:/root/.ollama

  mysql-test:
    image: mysql:8.0
    profiles: [test]
    environment:
      MYSQL_ROOT_PASSWORD: test-only-root
      MYSQL_DATABASE: xling_test
      MYSQL_USER: xling_test
      MYSQL_PASSWORD: test-only
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    tmpfs:
      - /var/lib/mysql
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 2s
      timeout: 3s
      retries: 30

  mysql-tests: &test-service
    profiles: [test]
    build:
      context: .
      target: test
    depends_on:
      mysql-test:
        condition: service_healthy
    environment:
      MYSQL_TEST_DATABASE_URL: mysql+pymysql://xling_test:test-only@mysql-test:3306/xling_test?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://xling_test:test-only@mysql-test:3306/xling_test?charset=utf8mb4
      AI_PROVIDER: mock
      KNOWLEDGE_VECTOR_ENABLED: "false"
    command: ["python", "-m", "pytest", "tests/test_support_turn_mysql.py", "-q"]
    volumes:
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./scripts:/app/scripts:ro
      - ./.env.example:/app/.env.example:ro

  tests:
    <<: *test-service
    command: ["python", "-m", "pytest", "-q"]

  app:
    build: .
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 本机可变配置统一来自 .env；这里只保留容器网络、派生地址和必要校验。
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-xling}:${MYSQL_PASSWORD:-xling}@mysql:3306/${MYSQL_DATABASE:-xling}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      CHROMA_PERSIST_DIR: /app/data/chroma
      EXCEL_PATH: /app/data/xling-risk-ledger.xlsx
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  ollama-data:
  app-data:
  caddy-data:
  caddy-config:
